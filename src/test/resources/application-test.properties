spring.application.name=investir_mais

# --- Banco H2 (100% isolado em memória, sem senha) ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# --- E-mail Mockado (Valores Fictícios - NADA DE CREDENCIAIS REAIS) ---
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test_user
spring.mail.password=test_password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Configurações Fictícias de API e Criptografia ---
app.public-base-url=http://localhost:8080
brapi.token=dummy-test-token-123