spring.application.name=investir_mais

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# Configuração do Banco de Dados PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hash de senha (Argon2)
security.argon2.salt-length=16
security.argon2.hash-length=32
security.argon2.parallelism=1
security.argon2.memory=${ARGON2_MEMORY}
security.argon2.iterations=3

# Autenticação (JWT)
api.security.token.secret=${JWT_SECRET}

# Criptografia de dados sensíveis no banco (AES-256/GCM)
api.security.db.encryption.key=${DB_ENCRYPTION_KEY}
security.aes.kdf.salt=${AES_KDF_SALT}
security.aes.kdf.iterations=${AES_KDF_ITERATIONS}

# E-mail (recuperação de conta e verificação de cadastro)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false

#Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.upload-preset=${CLOUDINARY_UPLOAD_PRESET}


# Hardening de segurança
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
spring.main.banner-mode=off