spring.application.name=investir_mais
spring.profiles.default=dev

spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.serialization-mode=via-dto

# Persist account email events and remove delivered/obsolete messages.
spring.modulith.events.completion-mode=DELETE
spring.modulith.events.republish-outstanding-events-on-restart=true
app.mail.retry-delay=${ACCOUNT_MAIL_RETRY_DELAY:30s}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/investir_mais}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

spring.sql.init.platform=${DB_PLATFORM:postgresql}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.enable-data-rest=true
springdoc.enable-spring-data-rest=true

app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# Redis shared by Spring Session and Spring Cache, with separate key prefixes.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false

# Index required by AccountSecurityService to revoke sessions by principal.
spring.session.data.redis.repository-type=indexed
spring.session.data.redis.namespace=investir-mais:session

spring.cache.type=redis
spring.cache.cache-names=cotacoes
spring.cache.redis.time-to-live=${QUOTE_CACHE_TTL:1m}
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=investir-mais:cache:

brapi.token=${BRAPI_TOKEN:}
spring.http.serviceclient.brapi.base-url=${BRAPI_BASE_URL:https://brapi.dev/api}
spring.http.serviceclient.brapi.connect-timeout=${BRAPI_CONNECT_TIMEOUT:3s}
spring.http.serviceclient.brapi.read-timeout=${BRAPI_READ_TIMEOUT:10s}

app.security.rate-limit.capacity=${AUTH_RATE_LIMIT_CAPACITY:10}
app.security.rate-limit.refill-period=${AUTH_RATE_LIMIT_PERIOD:1m}
app.security.rate-limit.namespace=${AUTH_RATE_LIMIT_NAMESPACE:investir-mais:rate-limit}

resilience4j.circuitbreaker.instances.brapi.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.brapi.sliding-window-size=10
resilience4j.circuitbreaker.instances.brapi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.brapi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.brapi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.brapi.permitted-number-of-calls-in-half-open-state=3

spring.threads.virtual.enabled=true

#---
spring.config.activate.on-profile=dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always

#---
spring.config.activate.on-profile=prod
server.servlet.session.cookie.secure=true
# Ainda não há migrações versionadas para as entidades de domínio; manter update
# evita falha de inicialização em bancos existentes até adotar Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-postgresql.sql

#---
spring.config.activate.on-profile=test
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.sql.init.schema-locations=classpath:schema-postgresql.sql
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test_user
spring.mail.password=test_password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=
app.public-base-url=http://localhost:8080
brapi.token=dummy-test-token-123
